<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tree Visualization</title>
    <style>
      body {
        margin: 0;
        padding: 50px;
        background: #0d1117;
      }
      .container {
        width: max-content;
        margin: 0 auto;
      }
      svg {
        background: #0d1117;
        border-radius: 8px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg xmlns="http://www.w3.org/2000/svg" width="400" height="260">
        <line
          x1="50"
          y1="130"
          x2="110"
          y2="210"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <line
          x1="170"
          y1="50"
          x2="50"
          y2="130"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <line
          x1="170"
          y1="50"
          x2="230"
          y2="130"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <line
          x1="230"
          y1="130"
          x2="290"
          y2="210"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <circle
          cx="50"
          cy="130"
          r="22"
          fill="#0d1117"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <text
          x="50"
          y="136"
          fill="#e6edf3"
          font-family="monospace"
          font-size="16"
          font-weight="bold"
          text-anchor="middle"
        >
          -10
        </text>
        <circle
          cx="110"
          cy="210"
          r="22"
          fill="#0d1117"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <text
          x="110"
          y="216"
          fill="#e6edf3"
          font-family="monospace"
          font-size="16"
          font-weight="bold"
          text-anchor="middle"
        >
          -3
        </text>
        <circle
          cx="170"
          cy="50"
          r="22"
          fill="#0d1117"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <text
          x="170"
          y="56"
          fill="#e6edf3"
          font-family="monospace"
          font-size="16"
          font-weight="bold"
          text-anchor="middle"
        >
          0
        </text>
        <circle
          cx="230"
          cy="130"
          r="22"
          fill="#0d1117"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <text
          x="230"
          y="136"
          fill="#e6edf3"
          font-family="monospace"
          font-size="16"
          font-weight="bold"
          text-anchor="middle"
        >
          5
        </text>
        <circle
          cx="290"
          cy="210"
          r="22"
          fill="#0d1117"
          stroke="#a8c7fa"
          stroke-width="2"
        />
        <text
          x="290"
          y="216"
          fill="#e6edf3"
          font-family="monospace"
          font-size="16"
          font-weight="bold"
          text-anchor="middle"
        >
          9
        </text>
      </svg>
    </div>
  </body>
</html>
